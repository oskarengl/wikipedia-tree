<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wikipedia tree</title>
<style>
  :root {
    --bg-a: #f8e6c8;
    --bg-b: #f0d2a8;
    --paper: #fbf5e2;
    --paper-edge: #e4d4ab;
    --ink: #3a2a1a;
    --muted: #8a7558;
    --accent: #b8602b;
    --line: #c89764;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Iowan Old Style", Georgia, "Times New Roman", serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 20% 10%, #fbeed4 0%, transparent 55%),
      radial-gradient(circle at 80% 90%, #f3d4a8 0%, transparent 50%),
      linear-gradient(135deg, var(--bg-a), var(--bg-b));
    background-attachment: fixed;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  #viewport {
    position: fixed; inset: 0; overflow: hidden;
    cursor: default;
  }
  #viewport.pan-mode  { cursor: grab; }
  #viewport.dragging  { cursor: grabbing; }

  #canvas {
    position: absolute;
    left: 50%;
    top: 90px;
    transform-origin: 0 0;
    will-change: transform;
  }

  #edges {
    position: absolute;
    pointer-events: none;
    overflow: visible;
  }
  #edges path {
    fill: none;
    stroke: var(--line);
    stroke-width: 2;
    opacity: 0.6;
    stroke-linecap: round;
  }

  @keyframes cardUnroll {
    from { clip-path: inset(0 0 calc(100% - 38px) 0 round 18px); }
    to   { clip-path: inset(0 0 0px              0 round 18px); }
  }

  @keyframes contentReveal {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .node {
    position: absolute;
    width: 480px;
    background: var(--paper);
    background-image:
      radial-gradient(rgba(150, 110, 60, 0.04) 1px, transparent 1px);
    background-size: 3px 3px;
    border: 1px solid var(--paper-edge);
    border-radius: 18px;
    box-shadow:
      0 10px 30px rgba(80, 50, 20, 0.14),
      0 2px 6px rgba(80, 50, 20, 0.08),
      inset 0 0 0 1px rgba(255, 255, 255, 0.4);
    overflow: hidden;
    display: flex; flex-direction: column;
    max-height: 540px;
    transition: box-shadow 0.2s;
    user-select: text;
  }
  .node.blooming {
    clip-path: inset(0 0 calc(100% - 20px) 0 round 18px);
    animation: cardUnroll 0.75s cubic-bezier(0.6, 0, 0.1, 1) both;
    animation-play-state: paused;
  }
  .node-body.content-hidden {
    opacity: 0;
    pointer-events: none;
  }
  .node-body.content-revealing {
    animation: contentReveal 0.18s ease-out forwards;
  }
  .node.focused {
    box-shadow:
      0 0 0 2px var(--accent),
      0 14px 36px rgba(80, 50, 20, 0.18),
      0 2px 6px rgba(80, 50, 20, 0.08);
  }
  .node.root .node-header {
    background: linear-gradient(180deg, rgba(184, 96, 43, 0.18), rgba(184, 96, 43, 0.05));
  }

  .node-header {
    padding: 10px 14px;
    background: linear-gradient(180deg, rgba(201, 150, 100, 0.12), rgba(201, 150, 100, 0.02));
    border-bottom: 1px solid var(--paper-edge);
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .node-title {
    font-weight: 600;
    font-size: 15px;
    flex: 1;
    font-variant: small-caps;
    letter-spacing: 0.03em;
    cursor: default;
  }
  .node-icon {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.6;
  }
  .node-close {
    cursor: pointer;
    color: var(--muted);
    padding: 1px 7px;
    border-radius: 50%;
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1;
    transition: all 0.15s;
  }
  .node-close:hover {
    background: rgba(0,0,0,0.06);
    color: var(--ink);
  }

  .node-body {
    padding: 14px 18px 18px;
    overflow: auto;
    flex: 1;
    font-size: 13.5px;
    line-height: 1.55;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .node-body::-webkit-scrollbar { width: 8px; }
  .node-body::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 4px;
    opacity: 0.5;
  }
  .node-body::-webkit-scrollbar-track { background: transparent; }

  .node-body img { max-width: 100%; height: auto; border-radius: 6px; }
  .node-body figure { margin: 8px 0; }
  .node-body figcaption { font-size: 11.5px; color: var(--muted); font-style: italic; }
  .node-body a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px dotted rgba(184, 96, 43, 0.4);
    cursor: pointer;
  }
  .node-body a:hover {
    border-bottom-style: solid;
    background: rgba(184, 96, 43, 0.08);
  }
  .node-body a.ext::after {
    content: " ↗";
    font-size: 0.8em;
    opacity: 0.6;
  }
  .node-body h1 { font-size: 20px; margin: 0 0 12px; border-bottom: 1px solid var(--paper-edge); padding-bottom: 6px; }
  .node-body h2, .node-body h3, .node-body h4 {
    font-family: "Iowan Old Style", Georgia, serif;
    margin-top: 18px;
    margin-bottom: 6px;
  }
  .node-body h2 { font-size: 17px; border-bottom: 1px solid var(--paper-edge); padding-bottom: 4px; }
  .node-body h3 { font-size: 15px; }
  .node-body p { margin: 8px 0; }
  .node-body ul, .node-body ol { padding-left: 22px; }
  .node-body table {
    font-size: 12px;
    border-collapse: collapse;
    margin: 8px 0;
    max-width: 100%;
  }
  .node-body table.infobox, .node-body .infobox {
    float: none !important;
    margin: 0 auto 12px !important;
    max-width: 100% !important;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 8px;
    padding: 8px !important;
    border: 1px solid var(--paper-edge);
  }
  .node-body th, .node-body td {
    padding: 3px 6px;
    border: 1px solid rgba(180, 140, 90, 0.2);
    text-align: left;
    vertical-align: top;
  }
  .node-body .thumb { max-width: 220px; }
  .node-body sup, .node-body .reference, .node-body .mw-cite-backlink { display: none; }
  .node-body .hatnote { font-size: 12px; color: var(--muted); font-style: italic; padding: 4px 0; }
  .node-body .mw-empty-elt { display: none; }
  .node-body .IPA, .node-body .nowrap { white-space: nowrap; }

  .node-loading, .node-error {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-style: italic;
  }
  .node-loading::after {
    content: "…";
    display: inline-block;
    animation: dots 1.4s infinite;
  }
  @keyframes dots {
    0%, 20% { content: "."; }
    40% { content: ".."; }
    60%, 100% { content: "..."; }
  }

  #topbar {
    position: fixed;
    top: 14px; left: 14px; right: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  .brand {
    font-family: "Iowan Old Style", Georgia, serif;
    font-style: italic;
    font-size: 18px;
    color: var(--ink);
    opacity: 0.75;
    padding: 4px 4px 0;
    letter-spacing: 0.02em;
  }
  .brand .dot { color: var(--accent); }
  #version-badge {
    position: fixed;
    bottom: 14px;
    left: 14px;
    font-family: "Iowan Old Style", Georgia, serif;
    font-style: italic;
    font-size: 10.5px;
    color: var(--ink);
    opacity: 0.2;
    pointer-events: none;
    letter-spacing: 0.01em;
    z-index: 10;
  }
  .spacer { flex: 1; }
  #btn-new {
    width: 36px;
    height: 36px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    border-radius: 50%;
    cursor: pointer;
    color: var(--paper-edge);
    box-shadow: 0 2px 6px rgba(80, 50, 20, 0.08);
    transition: all 0.18s;
  }
  #btn-new:hover {
    background: #fff8e6;
    color: var(--line);
    border-color: var(--line);
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(80, 50, 20, 0.12);
  }
  #btn-new:active { transform: translateY(0); }

  #root-hint {
    position: absolute;
    width: 480px;
    text-align: center;
    font-size: 12.5px;
    font-style: italic;
    color: var(--muted);
    pointer-events: none;
    transition: opacity 0.7s ease;
  }
  #root-hint.hidden { opacity: 0; }

  #minimap {
    position: fixed;
    bottom: 14px; right: 14px;
    width: 140px; height: 100px;
    background: rgba(251, 245, 226, 0.75);
    border: 1px solid var(--paper-edge);
    border-radius: 10px;
    overflow: hidden;
    pointer-events: none;
    backdrop-filter: blur(4px);
  }
  #minimap svg { width: 100%; height: 100%; }
  #minimap .mm-node { fill: var(--accent); opacity: 0.5; }
  #minimap .mm-root { fill: var(--accent); opacity: 1; }
  #minimap .mm-view { fill: none; stroke: var(--ink); stroke-width: 1; opacity: 0.4; }
</style>
</head>

<script>
"use strict";

const STORAGE_KEY = 'wikitree.v2';
const NODE_W = 480;
const NODE_H_MAX = 540;
const NODE_H_EST = 540;
const HGAP = 60;
const VGAP = 90;

// ---------- state ----------
let state = {
  rootId: null,
  nodes: {},   // id -> {id, title, parentId, childIds, layout, el}
};

let view = { x: 0, y: 0, scale: 1 };
let focusedId = null;
const animatingEdges = new Set();

const viewport = document.getElementById('viewport');
const canvas = document.getElementById('canvas');
const edgesEl = document.getElementById('edges');
const minimapSvg = document.querySelector('#minimap svg');

// ---------- utils ----------
function uid() { return Math.random().toString(36).slice(2, 10); }

function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- persistence ----------
function save() {
  const lite = {
    rootId: state.rootId,
    view,
    nodes: {},
  };
  for (const id in state.nodes) {
    const n = state.nodes[id];
    lite.nodes[id] = {
      id: n.id, title: n.title,
      parentId: n.parentId,
      childIds: [...n.childIds],
    };
  }
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(lite)); } catch(e) {}
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const lite = JSON.parse(raw);
    if (!lite.rootId || !lite.nodes[lite.rootId]) return false;
    state.rootId = lite.rootId;
    state.nodes = {};
    for (const id in lite.nodes) {
      const n = lite.nodes[id];
      state.nodes[id] = {
        ...n,
        el: null,
        layout: { x: 0, y: 0, h: NODE_H_EST },
      };
    }
    if (lite.view) view = lite.view;
    return true;
  } catch(e) { return false; }
}

// ---------- wikipedia ----------
async function fetchRandomTitle() {
  const url = 'https://en.wikipedia.org/w/api.php' +
    '?action=query&format=json&list=random&rnnamespace=0&rnlimit=1&origin=*';
  const r = await fetch(url);
  const j = await r.json();
  return j.query.random[0].title;
}

async function fetchArticleHtml(title) {
  const url = 'https://en.wikipedia.org/api/rest_v1/page/html/' +
    encodeURIComponent(title.replace(/ /g, '_'));
  const r = await fetch(url, { headers: { Accept: 'text/html' }});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.text();
}

function sanitizeArticleHtml(html, nodeId) {
  const doc = new DOMParser().parseFromString(html, 'text/html');

  // Strip navigation / chrome elements — but NOT .noprint (it wraps some thumbnails)
  const removeSel = [
    '.mw-editsection',
    '[role="navigation"]',
    '.navbox', '.vertical-navbox',
    '.ambox', '.metadata', '.mbox-small',
    '.sistersitebox',
    '.references', '.mw-references-wrap', '.reflist',
    '.hatnote.navigation-not-searchable',
    'figure[typeof~="mw:Error"]',
    'link', 'meta', 'style', 'script',
  ];
  doc.querySelectorAll(removeSel.join(',')).forEach(e => e.remove());

  // Strip terminal sections
  doc.querySelectorAll('section').forEach(sec => {
    const h = sec.querySelector('h2, h3');
    if (h) {
      const t = h.textContent.trim().toLowerCase();
      if (['references','external links','further reading','notes',
           'citations','bibliography','sources','see also'].includes(t)) {
        sec.remove();
      }
    }
  });

  // --- Fix images ---
  // 1. Unwrap <noscript> fallback images (browser keeps lazy-load JS images hidden)
  doc.querySelectorAll('noscript').forEach(ns => {
    const tmp = doc.createElement('div');
    tmp.innerHTML = ns.textContent;
    const img = tmp.querySelector('img');
    if (img) ns.replaceWith(img);
    else ns.remove();
  });

  // 2. Force-load every image eagerly — loading="lazy" fails inside CSS-transformed
  //    canvases because the browser's intersection observer checks window coords,
  //    not the visual position after transform.
  doc.querySelectorAll('img').forEach(img => {
    img.setAttribute('loading', 'eager');
    img.removeAttribute('decoding');

    // Fix protocol-relative URLs → https
    for (const attr of ['src', 'srcset', 'data-src', 'data-srcset']) {
      const v = img.getAttribute(attr);
      if (v) img.setAttribute(attr, v.replace(/(^|,\s*)\/\//g, '$1https://'));
    }

    // data-src lazy-load fallback
    if (!img.getAttribute('src') && img.getAttribute('data-src')) {
      img.setAttribute('src', img.getAttribute('data-src'));
    }
  });

  // Fix protocol-relative hrefs on links and source elements
  doc.querySelectorAll('[href^="//"], [src^="//"]').forEach(el => {
    if (el.href) el.setAttribute('href', 'https:' + el.getAttribute('href'));
    if (el.src)  el.setAttribute('src',  'https:' + el.getAttribute('src'));
  });

  // Prefix IDs to avoid cross-node collisions
  doc.querySelectorAll('[id]').forEach(el => {
    el.id = nodeId + '__' + el.id;
  });

  return doc.body.innerHTML;
}

// ---------- tree mutation ----------
function createNode(title, parentId, animate = false) {
  const id = uid();
  const n = {
    id, title, parentId,
    childIds: [],
    el: null,
    layout: { x: 0, y: 0, h: NODE_H_EST },
  };
  state.nodes[id] = n;
  if (parentId) state.nodes[parentId].childIds.push(id);
  else state.rootId = id;
  buildNodeElement(n, animate);
  loadArticleInto(n);
  if (!parentId) createRootHint();
  return n;
}

function removeNode(id) {
  const n = state.nodes[id];
  if (!n) return;
  [...n.childIds].forEach(removeNode);
  if (n.parentId) {
    const p = state.nodes[n.parentId];
    if (p) p.childIds = p.childIds.filter(c => c !== id);
  } else {
    state.rootId = null;
  }
  if (n.el) n.el.remove();
  delete state.nodes[id];
  if (focusedId === id) focusedId = null;
  relayout();
  save();
}

// ---------- DOM ----------
function buildNodeElement(n, animate = false) {
  const el = document.createElement('div');
  el.className = 'node' + (n.parentId ? '' : ' root') + (animate ? ' blooming' : '');
  el.dataset.id = n.id;
  const bodyClass = animate ? 'node-body content-hidden' : 'node-body';
  el.innerHTML = `
    <div class="node-header">
      <div class="node-icon"></div>
      <div class="node-title"></div>
      <div class="node-close" title="remove this branch">×</div>
    </div>
    <div class="${bodyClass}"><div class="node-loading">opening</div></div>
  `;
  el.querySelector('.node-title').textContent = n.title;
  el.querySelector('.node-close').addEventListener('click', ev => {
    ev.stopPropagation();
    removeNode(n.id);
  });
  el.addEventListener('mousedown', ev => {
    setFocus(n.id);
  });
  if (animate) {
    el.addEventListener('animationend', () => {
      el.classList.remove('blooming');
      n._animDone = true;
      tryReveal(n);
    }, { once: true });
  }
  canvas.appendChild(el);
  n.el = el;
}

function tryReveal(n) {
  if (!n._animDone || !n._contentReady) return;
  const body = n.el.querySelector('.node-body');
  body.classList.remove('content-hidden');
  body.classList.add('content-revealing');
}

async function loadArticleInto(n) {
  const body = n.el.querySelector('.node-body');
  try {
    const html = await fetchArticleHtml(n.title);
    const clean = sanitizeArticleHtml(html, n.id);
    body.innerHTML = clean;
    wireLinks(n, body);
    requestAnimationFrame(() => {
      n.layout.h = Math.min(NODE_H_MAX, n.el.offsetHeight);
      relayout();
    });
    if (n.parentId) { n._contentReady = true; tryReveal(n); }
  } catch (e) {
    body.innerHTML = `<div class="node-error">couldn't load article<br><small>${escapeHtml(e.message)}</small></div>`;
    if (n.parentId) { n._contentReady = true; tryReveal(n); }
  }
}

function wireLinks(node, body) {
  body.querySelectorAll('a').forEach(a => {
    const href = a.getAttribute('href') || '';
    if (!href) return;

    if (href.startsWith('./') || href.startsWith('/wiki/')) {
      // Internal wiki link → spawn child
      a.addEventListener('click', ev => {
        if (ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button !== 0) return;
        ev.preventDefault();
        ev.stopPropagation();
        let raw = href.startsWith('./') ? href.slice(2) : href.slice(6);
        raw = raw.split('#')[0];
        if (!raw) return;
        const title = decodeURIComponent(raw).replace(/_/g, ' ');
        spawnChild(node, title);
      });
    } else if (href.startsWith('#')) {
      // anchor within article — scroll within this node
      a.addEventListener('click', ev => {
        ev.preventDefault();
        const tid = node.id + '__' + href.slice(1);
        const t = document.getElementById(tid);
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    } else {
      // external link
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.classList.add('ext');
    }
  });
}

function createRootHint() {
  const old = document.getElementById('root-hint');
  if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'root-hint';
  el.textContent = 'click a link to grow the tree';
  canvas.appendChild(el);
}

function dismissRootHint() {
  const el = document.getElementById('root-hint');
  if (!el) return;
  el.classList.add('hidden');
  setTimeout(() => el.remove(), 750);
}

function spawnChild(parent, title) {
  const existing = parent.childIds.map(id => state.nodes[id])
    .find(c => c && c.title.toLowerCase() === title.toLowerCase());
  if (existing) { setFocus(existing.id); centerOn(existing.id); return; }
  dismissRootHint();
  const child = createNode(title, parent.id, true);

  // Register edge as animating BEFORE relayout so drawEdges() skips creating a static path for it
  const LINE_DUR = 420;
  const eid = `${parent.id}->${child.id}`;
  animatingEdges.add(eid);

  relayout();
  save();

  // Draw the animated edge path manually
  const x1 = parent.layout.x + NODE_W / 2;
  const y1 = parent.layout.y + parent.layout.h;
  const x2 = child.layout.x + NODE_W / 2;
  const y2 = child.layout.y;
  const my = (y1 + y2) / 2;
  const d = `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;
  const linePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  linePath.dataset.eid = eid;
  linePath.setAttribute('d', d);
  edgesEl.appendChild(linePath);

  // Stroke-dashoffset trick: draw the line over LINE_DUR ms
  requestAnimationFrame(() => {
    const len = linePath.getTotalLength();
    linePath.style.strokeDasharray = len;
    linePath.style.strokeDashoffset = len;
    requestAnimationFrame(() => {
      linePath.style.transition = `stroke-dashoffset ${LINE_DUR}ms cubic-bezier(0.4, 0, 0.2, 1)`;
      linePath.style.strokeDashoffset = '0';
    });
  });

  // Once line finishes, clean up stroke animation and bloom the card
  setTimeout(() => {
    linePath.style.transition = '';
    linePath.style.strokeDasharray = '';
    linePath.style.strokeDashoffset = '';
    animatingEdges.delete(eid);
    child.el.style.animationPlayState = 'running';
  }, LINE_DUR);

  setTimeout(() => centerOn(child.id), LINE_DUR + 300);
  setFocus(child.id);
}

function setFocus(id) {
  if (focusedId === id) return;
  if (focusedId && state.nodes[focusedId] && state.nodes[focusedId].el) {
    state.nodes[focusedId].el.classList.remove('focused');
  }
  focusedId = id;
  if (state.nodes[id] && state.nodes[id].el) {
    state.nodes[id].el.classList.add('focused');
  }
}

// ---------- layout ----------
function subtreeWidth(id) {
  const n = state.nodes[id];
  if (!n || n.childIds.length === 0) return NODE_W;
  let sum = 0;
  for (const c of n.childIds) sum += subtreeWidth(c);
  sum += (n.childIds.length - 1) * HGAP;
  return Math.max(NODE_W, sum);
}

function layoutNode(id, centerX, top) {
  const n = state.nodes[id];
  if (!n) return;
  n.layout.x = centerX - NODE_W / 2;
  n.layout.y = top;
  const childrenTop = top + n.layout.h + VGAP;
  const cws = n.childIds.map(c => subtreeWidth(c));
  let total = cws.reduce((a, b) => a + b, 0) + Math.max(0, cws.length - 1) * HGAP;
  let cur = centerX - total / 2;
  for (let i = 0; i < n.childIds.length; i++) {
    layoutNode(n.childIds[i], cur + cws[i] / 2, childrenTop);
    cur += cws[i] + HGAP;
  }
}

function relayout() {
  if (!state.rootId) {
    edgesEl.innerHTML = '';
    drawMinimap();
    return;
  }
  // refresh measured heights
  for (const id in state.nodes) {
    const n = state.nodes[id];
    if (n.el && n.el.offsetHeight > 0) {
      n.layout.h = Math.min(NODE_H_MAX, n.el.offsetHeight);
    }
  }
  layoutNode(state.rootId, 0, 0);
  for (const id in state.nodes) {
    const n = state.nodes[id];
    if (n.el) {
      n.el.style.transform = `translate(${n.layout.x}px, ${n.layout.y}px)`;
    }
  }
  drawEdges();
  drawMinimap();

  const hintEl = document.getElementById('root-hint');
  if (hintEl && state.rootId) {
    const r = state.nodes[state.rootId];
    hintEl.style.transform = `translate(${r.layout.x}px, ${r.layout.y + r.layout.h + 18}px)`;
  }
}

function drawEdges() {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const id in state.nodes) {
    const n = state.nodes[id];
    minX = Math.min(minX, n.layout.x);
    maxX = Math.max(maxX, n.layout.x + NODE_W);
    minY = Math.min(minY, n.layout.y);
    maxY = Math.max(maxY, n.layout.y + n.layout.h);
  }
  if (!isFinite(minX)) { edgesEl.innerHTML = ''; return; }
  const pad = 100;
  const w = (maxX - minX) + 2 * pad;
  const h = (maxY - minY) + 2 * pad;
  edgesEl.setAttribute('viewBox', `${minX - pad} ${minY - pad} ${w} ${h}`);
  edgesEl.style.left = (minX - pad) + 'px';
  edgesEl.style.top = (minY - pad) + 'px';
  edgesEl.style.width = w + 'px';
  edgesEl.style.height = h + 'px';

  // Remove stale non-animating paths
  for (const path of [...edgesEl.querySelectorAll('path[data-eid]')]) {
    const eid = path.dataset.eid;
    const [pid, cid] = eid.split('->');
    const valid = state.nodes[pid]?.childIds.includes(cid) && state.nodes[cid];
    if (!valid && !animatingEdges.has(eid)) path.remove();
  }

  for (const id in state.nodes) {
    const n = state.nodes[id];
    for (const cid of n.childIds) {
      const c = state.nodes[cid];
      if (!c) continue;
      const eid = `${id}->${cid}`;
      if (animatingEdges.has(eid)) continue;
      const x1 = n.layout.x + NODE_W / 2;
      const y1 = n.layout.y + n.layout.h;
      const x2 = c.layout.x + NODE_W / 2;
      const y2 = c.layout.y;
      const my = (y1 + y2) / 2;
      const d = `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;
      let path = edgesEl.querySelector(`path[data-eid="${eid}"]`);
      if (!path) {
        path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.dataset.eid = eid;
        edgesEl.appendChild(path);
      }
      path.setAttribute('d', d);
    }
  }
}

function drawMinimap() {
  if (!state.rootId) { minimapSvg.innerHTML = ''; return; }
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const id in state.nodes) {
    const n = state.nodes[id];
    minX = Math.min(minX, n.layout.x);
    maxX = Math.max(maxX, n.layout.x + NODE_W);
    minY = Math.min(minY, n.layout.y);
    maxY = Math.max(maxY, n.layout.y + n.layout.h);
  }
  if (!isFinite(minX)) return;
  const pad = 100;
  const w = (maxX - minX) + 2 * pad, h = (maxY - minY) + 2 * pad;
  minimapSvg.setAttribute('viewBox', `${minX - pad} ${minY - pad} ${w} ${h}`);
  let out = '';
  for (const id in state.nodes) {
    const n = state.nodes[id];
    out += `<rect class="${id === state.rootId ? 'mm-root' : 'mm-node'}" x="${n.layout.x}" y="${n.layout.y}" width="${NODE_W}" height="${n.layout.h}" rx="20"/>`;
  }
  // viewport rect (in canvas coords)
  const vw = window.innerWidth, vh = window.innerHeight;
  const cssOriginX = vw / 2, cssOriginY = 90;
  const vx = (-view.x - cssOriginX) / view.scale + cssOriginX / view.scale - cssOriginX / view.scale;
  // simpler: visible canvas region in canvas coords:
  const vMinX = (-view.x) / view.scale - (vw / 2) / view.scale + 0; // no, easier:
  // pos at screen (sx, sy): sx = cssOriginX + view.x + scale * X  -> X = (sx - cssOriginX - view.x) / scale
  const X1 = (0 - cssOriginX - view.x) / view.scale;
  const Y1 = (0 - cssOriginY - view.y) / view.scale;
  const X2 = (vw - cssOriginX - view.x) / view.scale;
  const Y2 = (vh - cssOriginY - view.y) / view.scale;
  out += `<rect class="mm-view" x="${X1}" y="${Y1}" width="${X2 - X1}" height="${Y2 - Y1}"/>`;
  minimapSvg.innerHTML = out;
}

// ---------- view (pan / zoom) ----------
let saveTimer = null;
function applyView() {
  canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
  drawMinimap();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}

// Normalize wheel delta across browsers/devices
function normalizeDelta(e) {
  let dx = e.deltaX, dy = e.deltaY;
  if (e.deltaMode === 1) { dx *= 20; dy *= 20; }       // line mode (Firefox mouse)
  else if (e.deltaMode === 2) { dx *= 400; dy *= 400; } // page mode
  return { dx, dy };
}

let dragging = false, dragStart = null;
let spaceDown = false;
let vel = { x: 0, y: 0 };
let lastPos = null, lastT = 0;
let inertiaRaf = null;

function startPan(clientX, clientY) {
  dragging = true;
  viewport.classList.add('dragging');
  dragStart = { x: clientX - view.x, y: clientY - view.y };
  vel = { x: 0, y: 0 };
  lastPos = { x: clientX, y: clientY };
  lastT = performance.now();
  cancelAnimationFrame(inertiaRaf);
}

// Space key → grab cursor / pan mode
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.target.closest('input, textarea, [contenteditable]')) {
    e.preventDefault();
    spaceDown = true;
    if (!dragging) viewport.classList.add('pan-mode');
  }
  if ((e.ctrlKey || e.metaKey) && e.key === '0') { e.preventDefault(); fitAll(); }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    spaceDown = false;
    if (!dragging) viewport.classList.remove('pan-mode');
  }
});

// Left-drag on background OR space+left-drag anywhere OR middle-click drag
viewport.addEventListener('mousedown', e => {
  const onNode = !!e.target.closest('.node');
  const isMiddle = e.button === 1;
  const isLeft = e.button === 0;
  if (!isMiddle && !(isLeft && (!onNode || spaceDown))) return;
  if (isMiddle) e.preventDefault();
  startPan(e.clientX, e.clientY);
  if (!spaceDown && !onNode) viewport.classList.add('pan-mode');
});

window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const now = performance.now();
  const dt = now - lastT;
  if (dt > 0 && lastPos) {
    const a = 0.6; // EMA smoothing for velocity
    vel.x = a * (e.clientX - lastPos.x) / dt + (1 - a) * vel.x;
    vel.y = a * (e.clientY - lastPos.y) / dt + (1 - a) * vel.y;
  }
  lastT = now; lastPos = { x: e.clientX, y: e.clientY };
  view.x = e.clientX - dragStart.x;
  view.y = e.clientY - dragStart.y;
  applyView();
});

window.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  viewport.classList.remove('dragging');
  if (!spaceDown) viewport.classList.remove('pan-mode');

  // Inertia — coast to stop with exponential decay
  const speed = Math.hypot(vel.x, vel.y);
  if (speed > 0.04) {
    const FRICTION = 0.91;
    function coast() {
      view.x += vel.x * 16;
      view.y += vel.y * 16;
      vel.x *= FRICTION;
      vel.y *= FRICTION;
      applyView();
      if (Math.hypot(vel.x, vel.y) > 0.015)
        inertiaRaf = requestAnimationFrame(coast);
    }
    inertiaRaf = requestAnimationFrame(coast);
  }
});

// Returns the screen-space center of the focused node (or root, or viewport center)
// — used as the zoom pivot so zooming always stays anchored to what you're reading.
function getZoomPivot() {
  const targetId = focusedId || state.rootId;
  if (targetId && state.nodes[targetId]) {
    const n = state.nodes[targetId];
    const cssOriginX = window.innerWidth / 2;
    const cssOriginY = 90;
    return {
      px: cssOriginX + view.x + view.scale * (n.layout.x + NODE_W / 2),
      py: cssOriginY + view.y + view.scale * (n.layout.y + n.layout.h / 2),
    };
  }
  return { px: window.innerWidth / 2, py: window.innerHeight / 2 };
}

viewport.addEventListener('wheel', e => {
  const isZoom = e.ctrlKey || e.metaKey || e.shiftKey;
  // Let article scroll naturally when not zooming and cursor is over content
  if (!isZoom && e.target.closest('.node-body')) return;

  e.preventDefault();
  cancelAnimationFrame(inertiaRaf);
  const { dx, dy } = normalizeDelta(e);

  if (isZoom) {
    // Zoom toward cursor.
    // The canvas CSS origin is at (vw/2, 90px) in screen space, so we must
    // express the cursor position relative to that origin before doing the
    // pivot math — otherwise each tick drifts by vw/2.
    const rect = viewport.getBoundingClientRect();
    const originX = window.innerWidth / 2;
    const originY = 90; // matches CSS: #canvas { top: 90px }
    const pcx = (e.clientX - rect.left) - originX;
    const pcy = (e.clientY - rect.top)  - originY;
    const factor = Math.exp(-dy * 0.0012);
    const newScale = clamp(view.scale * factor, 0.1, 2.5);
    if (newScale <= 0.11 && view.scale > 0.11) { fitAll(); return; }
    const rf = newScale / view.scale;
    view.x = pcx - (pcx - view.x) * rf;
    view.y = pcy - (pcy - view.y) * rf;
    view.scale = newScale;
  } else {
    // Pan
    view.x -= dx;
    view.y -= dy;
  }
  applyView();
}, { passive: false });

// Touch: one-finger pan + two-finger pinch zoom
let touchStart = null, pinchDist0 = null, pinchScale0 = null;
viewport.addEventListener('touchstart', e => {
  cancelAnimationFrame(inertiaRaf);
  if (e.touches.length === 1) {
    const t = e.touches[0];
    if (!e.target.closest('.node-body')) {
      touchStart = { x: t.clientX - view.x, y: t.clientY - view.y };
    } else {
      touchStart = null;
    }
    pinchDist0 = null;
  } else if (e.touches.length === 2) {
    touchStart = null;
    const dx = e.touches[1].clientX - e.touches[0].clientX;
    const dy = e.touches[1].clientY - e.touches[0].clientY;
    pinchDist0 = Math.hypot(dx, dy);
    pinchScale0 = view.scale;
  }
}, { passive: true });

viewport.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && touchStart) {
    view.x = e.touches[0].clientX - touchStart.x;
    view.y = e.touches[0].clientY - touchStart.y;
    applyView();
  } else if (e.touches.length === 2 && pinchDist0) {
    const dx = e.touches[1].clientX - e.touches[0].clientX;
    const dy = e.touches[1].clientY - e.touches[0].clientY;
    const dist = Math.hypot(dx, dy);
    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const newScale = clamp(pinchScale0 * dist / pinchDist0, 0.1, 2.5);
    const rf = newScale / view.scale;
    view.x = mx - (mx - view.x) * rf;
    view.y = my - (my - view.y) * rf;
    view.scale = newScale;
    applyView();
  }
}, { passive: true });

viewport.addEventListener('touchend', () => { touchStart = null; pinchDist0 = null; });

window.addEventListener('resize', () => drawMinimap());

// ---------- navigation helpers ----------
function centerOn(id) {
  const n = state.nodes[id];
  if (!n) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const cssOriginX = vw / 2, cssOriginY = 90;
  const tx = n.layout.x + NODE_W / 2;
  const ty = n.layout.y + n.layout.h / 2;
  // want screen position vw/2, vh/2
  // sx = cssOriginX + view.x + scale * tx  ->  view.x = vw/2 - cssOriginX - scale*tx = -scale*tx
  // sy = cssOriginY + view.y + scale * ty  ->  view.y = vh/2 - cssOriginY - scale*ty
  const targetX = -view.scale * tx;
  const targetY = (vh / 2 - cssOriginY) - view.scale * ty;
  animateView(targetX, targetY, view.scale);
}

function fitAll() {
  if (!state.rootId) return;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const id in state.nodes) {
    const n = state.nodes[id];
    minX = Math.min(minX, n.layout.x);
    maxX = Math.max(maxX, n.layout.x + NODE_W);
    minY = Math.min(minY, n.layout.y);
    maxY = Math.max(maxY, n.layout.y + n.layout.h);
  }
  if (!isFinite(minX)) return;
  const pad = 80;
  const w = maxX - minX, h = maxY - minY;
  const vw = window.innerWidth, vh = window.innerHeight;
  const cssOriginX = vw / 2, cssOriginY = 90;
  const sx = (vw - 2 * pad) / w;
  const sy = (vh - 2 * pad - 100) / h;
  const newScale = clamp(Math.min(sx, sy), 0.15, 1);
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const targetX = -newScale * cx;
  const targetY = (vh / 2 - cssOriginY) - newScale * cy;
  animateView(targetX, targetY, newScale);
}

function animateView(tx, ty, ts) {
  const dur = 450;
  const start = performance.now();
  const sx = view.x, sy = view.y, sscale = view.scale;
  function step(now) {
    const t = Math.min(1, (now - start) / dur);
    const e = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
    view.x = sx + (tx - sx) * e;
    view.y = sy + (ty - sy) * e;
    view.scale = sscale + (ts - sscale) * e;
    applyView();
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ---------- buttons ----------
document.getElementById('btn-new').addEventListener('click', async () => {
  if (state.rootId && !confirm('Start a fresh tree? Your current one will be discarded.')) return;
  for (const id in state.nodes) { if (state.nodes[id].el) state.nodes[id].el.remove(); }
  state.nodes = {};
  state.rootId = null;
  focusedId = null;
  view = { x: 0, y: 0, scale: 1 };
  applyView();
  await startFresh();
});

// ---------- init ----------
async function startFresh() {
  let title;
  try {
    title = await fetchRandomTitle();
  } catch (e) {
    title = 'Tree';
  }
  createNode(title, null);
  setFocus(state.rootId);
  save();
}

async function init() {
  if (load() && state.rootId) {
    // rebuild DOM for all nodes, then load each article
    // build in order so parents exist first
    const order = [];
    const visit = id => {
      order.push(id);
      const n = state.nodes[id];
      for (const c of n.childIds) visit(c);
    };
    visit(state.rootId);
    for (const id of order) buildNodeElement(state.nodes[id]);
    relayout();
    applyView();
    for (const id of order) loadArticleInto(state.nodes[id]);
  } else {
    applyView();
    await startFresh();
  }
}

init();
</script>
